<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="David Itina">
  <!-- Deep ink surface matching portfolio dark theme -->
  <rect width="64" height="64" rx="12" fill="#1a1c22"/>
  <!-- Subtle inner frame -->
  <rect x="3" y="3" width="58" height="58" rx="10" fill="none" stroke="#2a2d35" stroke-width="1"/>
  <!-- DI monogram — editorial, confident -->
  <text
    x="32"
    y="42"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="400"
    letter-spacing="-0.04em"
    fill="#e8e6e1"
  >DI</text>
  <!-- Quiet signal accent underline -->
  <rect x="20" y="48" width="24" height="1.5" rx="0.75" fill="#5a9e78" opacity="0.9"/>
</svg>
